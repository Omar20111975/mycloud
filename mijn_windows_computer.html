<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Windows Computer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;overflow:hidden;background:#1683d8}
.desktop{
  width:100vw;height:100vh;
  background:linear-gradient(135deg,#0875c9,#35b5e8 55%,#075da8);
  position:relative;
}
.icon{position:absolute;width:90px;text-align:center;color:white;font-size:13px;cursor:pointer;text-shadow:1px 1px 2px #333}
.icon span{font-size:40px;display:block;margin-bottom:5px}
.window{
 position:absolute;left:8%;top:7%;width:84%;height:78%;
 background:#f4f4f4;border:1px solid #777;border-radius:8px;
 box-shadow:0 15px 40px #0007;display:none;overflow:hidden
}
.titlebar{height:42px;background:#fff;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ccc}
.titlebar b{flex:1}.controls button{border:0;background:white;width:38px;height:30px;font-size:16px}.controls button:hover{background:#ddd}
.chrome-tabs{height:42px;background:#ddd;display:flex;align-items:end;padding-left:10px}
.tab{background:#fff;padding:12px 22px;border-radius:10px 10px 0 0;font-size:13px}
.address{height:48px;background:#eee;padding:8px 15px;display:flex;gap:8px}
.address input{flex:1;border:0;border-radius:22px;padding:10px 16px;background:#fff;font-size:14px}
.address button{border:0;background:transparent;font-size:20px}
.webpage{height:calc(100% - 132px);background:white;padding:35px;overflow:auto}
.google{max-width:700px;margin:40px auto;text-align:center}
.google h1{font-size:60px;color:#4285f4;margin:20px}
.google input{width:90%;padding:15px 22px;border:1px solid #ddd;border-radius:28px;font-size:16px;box-shadow:0 2px 7px #ddd}
.google button{margin:20px 5px;padding:11px 18px;border:0;background:#f1f1f1;border-radius:5px}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:54px;background:#202124ee;display:flex;align-items:center;padding:0 10px;color:white}
.start{font-size:25px;padding:10px 15px;cursor:pointer}.start:hover{background:#ffffff22}
.task-icons{display:flex;gap:6px;margin-left:10px}.task-icons button{background:transparent;border:0;color:white;font-size:22px;padding:8px 12px;cursor:pointer}.task-icons button:hover{background:#ffffff22}
.clock{margin-left:auto;padding-right:15px;font-size:13px}
.startmenu{position:absolute;bottom:54px;left:10px;width:330px;height:390px;background:#252526ee;color:white;border-radius:10px 10px 0 0;padding:20px;display:none;box-shadow:0 0 25px #0008}
.startmenu h2{margin-top:0}.startmenu button{display:block;width:100%;padding:13px;margin:8px 0;background:#ffffff12;color:white;border:0;border-radius:6px;text-align:left;cursor:pointer}.startmenu button:hover{background:#ffffff25}
</style>
</head>
<body>
<div class="desktop">
  <div class="icon" style="left:25px;top:25px" onclick="openChrome()">
    <span>🌐</span>Google Chrome
  </div>
  <div class="icon" style="left:25px;top:125px" onclick="alert('Deze pc heeft geen echte bestanden, dit is een demo.')">
    <span>📁</span>Bestanden
  </div>

  <div class="window" id="chrome">
    <div class="titlebar">
      <b>🌐 Google Chrome</b>
      <div class="controls">
        <button onclick="minimize()">−</button>
        <button onclick="maximize()">□</button>
        <button onclick="closeChrome()">×</button>
      </div>
    </div>
    <div class="chrome-tabs">
      <div class="tab">🌐 Nieuwe tab</div>
    </div>
    <div class="address">
      <button>←</button><button>→</button><button>↻</button>
      <input id="url" value="https://www.google.com" onkeydown="if(event.key==='Enter')go()">
      <button onclick="go()">➜</button>
    </div>
    <div class="webpage" id="page">
      <div class="google">
        <h1>Google</h1>
        <input id="search" placeholder="Zoeken met Google" onkeydown="if(event.key==='Enter')search()">
        <br>
        <button onclick="search()">Google zoeken</button>
        <button onclick="search()">Ik doe een gok</button>
      </div>
    </div>
  </div>

  <div class="startmenu" id="startmenu">
    <h2>Windows</h2>
    <button onclick="openChrome();toggleStart()">🌐 Google Chrome</button>
    <button onclick="alert('Instellingen geopend (demo).')">⚙️ Instellingen</button>
    <button onclick="alert('Bestandsverkenner geopend (demo).')">📁 Bestandsverkenner</button>
  </div>

  <div class="taskbar">
    <div class="start" onclick="toggleStart()">⊞</div>
    <div class="task-icons">
      <button onclick="openChrome()">🌐</button>
      <button onclick="alert('Bestanden (demo)')">📁</button>
    </div>
    <div class="clock" id="clock"></div>
  </div>
</div>

<script>
function openChrome(){document.getElementById('chrome').style.display='block'}
function closeChrome(){document.getElementById('chrome').style.display='none'}
function minimize(){document.getElementById('chrome').style.display='none'}
function maximize(){
 const w=document.getElementById('chrome');
 w.style.left='0';w.style.top='0';w.style.width='100%';w.style.height='calc(100% - 54px)';
}
function toggleStart(){
 const s=document.getElementById('startmenu');
 s.style.display=s.style.display==='block'?'none':'block';
}
function go(){
 const url=document.getElementById('url').value;
 document.getElementById('page').innerHTML='<div style="padding:40px"><h2>Browserpagina</h2><p>Je hebt ingevoerd:</p><b>'+escapeHtml(url)+'</b><p>In deze demo wordt geen echte website geladen.</p></div>';
}
function search(){
 const q=document.getElementById('search').value;
 if(q) {
   document.getElementById('url').value='https://www.google.com/search?q='+encodeURIComponent(q);
   document.getElementById('page').innerHTML='<div style="padding:40px"><h2>Google zoeken</h2><p>Zoekopdracht:</p><b>'+escapeHtml(q)+'</b></div>';
 }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function updateClock(){
 const d=new Date();
 document.getElementById('clock').textContent=d.toLocaleDateString('nl-NL')+'  '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);updateClock();
</script>
</body>
</html>
